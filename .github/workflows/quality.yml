name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint (débito legado não bloqueia auditoria)
        continue-on-error: true
        run: bun run lint
      - name: Auditoria de botões e ações
        run: bun run audit:ui
      - name: Build de produção
        run: bun run build
