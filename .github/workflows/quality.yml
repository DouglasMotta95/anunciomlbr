name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Build de produção e geração de rotas
        shell: bash
        run: |
          set -o pipefail
          bun run build 2>&1 | tee build.log
      - name: Type-check estrito
        run: bun run typecheck
      - name: Testes do parser de busca Mercado Livre
        run: bun run test:search
      - name: Testes da coleta Firecrawl Mercado Livre
        run: bun run test:firecrawl
      - name: Testes do callGemini
        run: bun run test:gemini
      - name: Auditoria de segurança
        run: bun run audit:security
      - name: Auditoria de botões e ações
        shell: bash
        run: |
          set -o pipefail
          bun run audit:ui 2>&1 | tee audit-ui.log
      - name: Auditoria dos fluxos críticos
        run: bun run audit:flows
      - name: Salvar log da auditoria de ações
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-ui-audit-log
          path: audit-ui.log
      - name: Salvar log do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-build-log
          path: build.log
