name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Build de produção e geração de rotas
        shell: bash
        run: |
          set -o pipefail
          bun run build 2>&1 | tee build.log
      - name: Type-check estrito
        run: bun run typecheck
      - name: Testes do parser de busca Mercado Livre
        run: bun run test:search
      - name: Smokes reais Mercado Livre - iPhone, Lovable e Netflix
        shell: bash
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
        run: |
          for query in iPhone Lovable Netflix; do
            passed=false
            for attempt in 1 2 3; do
              echo "Tentativa $attempt do smoke real para $query"
              if bun run scripts/live-ml-search-smoke.ts "$query"; then
                passed=true
                break
              fi
              sleep $((attempt * 2))
            done
            if [ "$passed" != "true" ]; then
              echo "Smoke real falhou para $query"
              exit 1
            fi
          done
      - name: Testes do callGemini
        run: bun run test:gemini
      - name: Testes da coleta Firecrawl Mercado Livre
        run: bun run test:firecrawl
      - name: Inteligência comercial e radar de concorrentes
        run: bun test tests/growth-intelligence.test.ts
      - name: Suite comercial integrada
        run: bun test tests/commercial-suite.test.ts
      - name: Inteligência e automações v2
        run: bun test tests/intelligence-operations-v2.test.ts
      - name: Centro de controle administrativo
        run: bun test tests/admin-control-center.test.ts
      - name: Regressões críticas de publicação e pagamento
        run: bun test tests/critical-publish-payment-contract.test.ts
      - name: Proteção antiabuso de cadastro
        run: bun test tests/registration-abuse.test.ts
      - name: Auditoria de segurança
        run: bun run audit:security
      - name: Auditoria de botões e ações
        shell: bash
        run: |
          set -o pipefail
          bun run audit:ui 2>&1 | tee audit-ui.log
      - name: Auditoria dos fluxos críticos
        run: bun run audit:flows
      - name: Salvar log da auditoria de ações
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-ui-audit-log
          path: audit-ui.log
      - name: Salvar log do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-build-log
          path: build.log
