name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Auditoria de botões e ações
        shell: bash
        run: |
          set -o pipefail
          bun run audit:ui 2>&1 | tee audit-ui.log
      - name: Auditoria dos fluxos críticos
        run: bun run audit:flows
      - name: Salvar log da auditoria de ações
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-ui-audit-log
          path: audit-ui.log
      - name: Build de produção
        shell: bash
        run: |
          set -o pipefail
          bun run build 2>&1 | tee build.log
      - name: Salvar log do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-build-log
          path: build.log
