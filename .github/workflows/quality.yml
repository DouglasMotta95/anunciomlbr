name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint (débito legado)
        continue-on-error: true
        run: bun run lint
      - name: Auditoria de botões e ações
        run: bun run audit:ui
      - name: Build de produção
        shell: bash
        run: |
          set -o pipefail
          bun run build 2>&1 | tee build.log
      - name: Salvar log do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-build-log
          path: build.log
